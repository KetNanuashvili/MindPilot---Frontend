<div class="shell">
  <aside class="sidebar">
    <a routerLink="/" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="1.6"/>
          <path d="M16 7.5v17M9.2 16.8c2.4-3.8 4.4-5.7 6.8-5.7s4.4 1.9 6.8 5.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="16" cy="16" r="2.2" fill="currentColor"/>
        </svg>
      </span>
      <span>
        <strong>MindPilot</strong>
        <small>{{ t().brandTag }}</small>
      </span>
    </a>

    <nav class="side-nav" [attr.aria-label]="t().navToday">
      @for (link of links(); track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
        >
          <ng-container [ngTemplateOutlet]="icon" [ngTemplateOutletContext]="{ icon: link.icon }" />
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="side-foot">
      <app-lang-switch />
      <p>{{ t().sideNote }}</p>
    </div>
  </aside>

  <div class="shell-main">
    <header class="topbar">
      <a routerLink="/" class="brand brand-mobile">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="1.6"/>
            <path d="M16 7.5v17M9.2 16.8c2.4-3.8 4.4-5.7 6.8-5.7s4.4 1.9 6.8 5.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="16" cy="16" r="2.2" fill="currentColor"/>
          </svg>
        </span>
        <strong>MindPilot</strong>
      </a>
      <app-lang-switch />
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>

  <nav class="bottom-nav" [attr.aria-label]="t().navToday">
    @for (link of links(); track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: link.exact }"
      >
        <ng-container [ngTemplateOutlet]="icon" [ngTemplateOutletContext]="{ icon: link.icon }" />
        {{ link.label }}
      </a>
    }
  </nav>
</div>

<ng-template #icon let-icon="icon">
  @switch (icon) {
    @case ('sun') {
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/>
        <path d="M12 3v2M12 19v2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M3 12h2M19 12h2M4.9 19.1l1.5-1.5M17.6 6.4l1.5-1.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    }
    @case ('plan') {
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="4" y="5" width="16" height="15" rx="3" stroke="currentColor" stroke-width="1.7"/>
        <path d="M8 3v4M16 3v4M4 10h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    }
    @case ('chart') {
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 19V9M10 19v-6M15 19V7M20 19V4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    }
    @case ('spark') {
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3l1.6 6.2L20 11l-6.4 1.8L12 19l-1.6-6.2L4 11l6.4-1.8L12 3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
    }
  }
</ng-template>
